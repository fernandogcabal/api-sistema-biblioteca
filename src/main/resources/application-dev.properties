# Development profile configuration
# Active when SPRING_PROFILES_ACTIVE=dev (local development)

# Database configuration - auto-creates schema for development
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bibliotecadb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create/update schema (not for production!)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SSL disabled for local development (dev uses HTTP)
server.ssl.enabled=false

# JWT configuration - can be overridden via env variable
jwt.secret=${JWT_SECRET:dev-secret-key-minimum-32-characters-for-testing}
jwt.expiration=86400000
